    .hifi-header-title { font-weight: 700; font-size: 18px; color: var(--shell-text); }
    .hifi-header-title small { font-weight: 400; color: var(--shell-muted); margin-left: 8px; font-size: 14px; }
    .hifi-header-meta { font-size: 12px; color: var(--shell-muted); }

    .hifi-tab { padding: 12px 20px; background: none; border: none; cursor: pointer; font: inherit; font-size: 14px; font-weight: 500; color: var(--shell-muted); border-bottom: 2px solid transparent; transition: color 120ms, border-color 120ms; white-space: nowrap; }
    .hifi-tab:hover { color: var(--shell-text); }
    .hifi-tab.active { color: var(--shell-accent); border-bottom-color: var(--shell-accent); }

    .hifi-main { padding: 32px 24px 64px; background: var(--shell-bg); min-height: 100vh; }
    .hifi-screen { display: none; }
    .hifi-screen.active { display: block; }

    .hifi-screen-frame { margin: 0 auto; background: var(--shell-surface); min-height: 600px; max-width: var(--shell-container-max); box-shadow: var(--shell-shadow); border-radius: var(--shell-radius); overflow: hidden; padding: 32px; }
    .hifi-screen[data-device="mobile"] .hifi-screen-frame,
    .hifi-screen[data-device="mobile-web"] .hifi-screen-frame { max-width: var(--shell-mobile-max); }
    .hifi-screen[data-device="tablet"] .hifi-screen-frame { max-width: var(--shell-tablet-max); }

    .hifi-mobile-frame { --safe-area-top: 50px; --safe-area-bottom: 34px; max-width: var(--shell-mobile-max); margin: 0 auto; background: #0a0a0a; padding: 12px 10px; border-radius: 55px; box-shadow: var(--shell-shadow-lg); position: relative; }
    .hifi-mobile-frame::before { content:''; position:absolute; top:11px; left:50%; transform:translateX(-50%); width:125px; height:37px; background:#000; border-radius:22px; z-index:5; }
    .hifi-mobile-frame::after  { content:''; position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; background:#FFFFFF; border-radius:2.5px; opacity:0.65; z-index:5; }
    .hifi-mobile-frame .hifi-screen-frame { width:382px; height:850px; min-height:850px; max-width:382px; border-radius:43px; box-shadow:none; padding:0; overflow-y:auto; overflow-x:hidden; }
    .hifi-mobile-frame .hifi-screen-frame > *:first-child { min-height:100%; box-sizing:border-box; padding-top:var(--safe-area-top,50px); padding-bottom:var(--safe-area-bottom,34px); }
    .hifi-mobile-frame--web { display:flex; flex-direction:column; height:874px; }
    .hifi-mobile-frame--web .hifi-screen-frame { flex:1 1 auto; width:382px; max-width:382px; height:auto; min-height:0; border-radius:0; overflow-y:auto; overflow-x:hidden; }
    .hifi-mobile-frame--web .hifi-screen-frame > *:first-child { padding-top:0; padding-bottom:0; }
    .hifi-ios-status-bar { display:flex; align-items:center; justify-content:space-between; padding:14px 20px 8px; background:rgba(255,255,255,0.97); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-radius:43px 43px 0 0; border-bottom:0.5px solid rgba(0,0,0,0.06); position:relative; z-index:4; }

    .hifi-ios-status-bar__icons { display:flex; align-items:center; gap:5px; }
    .hifi-ios-status-bar__icons svg { display:block; }
    .hifi-mobile-web-bottom-bar { display:flex; align-items:center; padding:8px 8px 14px; background:rgba(248,248,250,0.97); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-top:0.5px solid rgba(0,0,0,0.10); border-radius:0 0 43px 43px; position:relative; z-index:4; }

<!-- iteration 2 (visual-polish pass, no wireframe changes — same 23 screens/data-cids as v1):
  - [general] Added avatar identity (initials, primary-light bg) to every person-row: admin users list,
    profile skater rows, guardian-dashboard attendance rows, attendance-entry skater rows.
  - [general] Added a branded identity header (org avatar + eyebrow) atop home-coach and guardian-dashboard —
    the wireframe started directly on content with no app identity.
  - [visual] Cards now carry a soft elevation shadow in addition to the border, per DESIGN.md's
    "subtle borders and soft shadows" elevation guidance (previously border-only, which read flat).
  - [visual] Chips now carry semantic color (event type, drill type, user role, attendance-%) using the
    chip status-success/warning/error/info/neutral variants already defined in DESIGN.md, instead of a
    single flat outlined/default treatment for everything.
  - [visual] Event tiles gained a colored left accent bar keyed to event type for faster scanning.
  - [visual] Sign-up welcome banners changed from a plain info Alert to a navy hero card with an avatar,
    matching the brand's authoritative navy identity instead of a generic banner.
  - [state] Bottom nav "More" item now carries an unread-count badge (tab-bar + badge tokens) on
    coach/guardian authenticated screens, reflecting the Notifications screen's unread items.
-->

<!-- iteration 3 (spacing/hierarchy pass, resolves designer review comments — same 23 screens/data-cids):
  - [general] DESIGN.md tab-bar token updated: bottom nav is now primary-main navy with secondary-yellow
    selected state (was background-paper/primary-main) — a deliberate design-system change, not a
    one-off hi-fi override, since it changes brand presence app-wide. tokens.mui.theme.ts regenerated.
  - [spacing] Increased the content-region gap (16px→24px) and list-row/event-tile internal spacing
    across all 23 screens — the 16px rhythm read as wireframe-tight next to the card/chip treatment.
  - [visual] Introduced a colored icon-badge SectionHeader for recurring section labels (Upcoming Events,
    Attendance, Drills, Skater(s), Topics) instead of plain h6 text, for clearer visual hierarchy.
  - [state] Screens that only had outline/text buttons now carry a single clear primary action per
    DESIGN.md's "no more than one primary button per screen" rule: edit-practice's Add Drill is now
    the primary (contained) action; drills-bank's add control is now a filled circular primary button;
    profile's Edit/LOA row actions upgraded from bare text buttons to small outlined buttons.
  - [general] New Event screen rebuilt: added the Save primary action that was missing from v1/v2, replaced
    the free-text Type field with a colored segmented control (reusing the event-type accent colors),
    replaced Recurrence with a real Select, and replaced Team(s) free text with toggleable team chips.
  - [general] Notifications screen rebuilt: each item is now a card with a type icon, unread items carry
    a colored accent bar and bold text plus a relative timestamp, and "Read" is a clear icon action
    instead of a bare text link. Unread section header shows a live count.
-->

<!-- iteration 4 (Sign Up — Guardian Invite rework — same 23 screens/data-cids):
  - [state] Replaced the Yes/No question controls (signup-guardian-invite, -yes, -no) — a filled Button
    read as a call-to-action when it's actually an exclusive selection that reveals fields, not a
    submit/navigate action. Now a pill-shaped ToggleButtonGroup (MUI's semantic control for an exclusive
    binary choice), visually distinct from the navy "Next" CTA below it: unanswered = neutral outline,
    selected = a light primary tint rather than a solid filled button.
-->

<!-- iteration 5 (Sign Up — Guardian Invite: yes/no control, take 2 — same 23 screens/data-cids):
  - [state] Replaced the v4 ToggleButtonGroup with a standard RadioGroup (Yes/No) — after discussion,
    radio buttons are the more conventional, unambiguous pattern for "answer one of two options in a
    form" (vs. a segmented toggle, which can still read as a mode switch). Reveal-on-select behavior
    is a well-understood radio pattern.
-->

<!-- iteration 6 (accessibility audit pass, WCAG 2.2 AA — same 23 screens/data-cids). Contrast ratios
     computed against the actual rendered hex pairs, not eyeballed:
  - [visual] BottomNav unselected icon/label was primary.light-on-primary.main = 1.37:1 (fails 4.5:1
    text minimum) — changed to the neutral-light token = 8.78:1.
  - [visual] Event-type-colored chips (EventTile, New Event's Type selector) hardcoded white text,
    which on the secondary/yellow "Game" variant was 1.71:1 (fails) — now resolves text color per
    accent (navy-on-yellow = 9.26:1, matching DESIGN.md's stated pairing), white on navy/info as before.
  - [visual] Notifications' "Past" item icon circle was text.disabled-on-white-icon = 2.11:1 (fails the
    3:1 non-text minimum) — changed the muted accent to text.secondary = 5.82:1.
  - [spacing] Primary reading content (list-row primary text, event date/time, question text, hero
    welcome copy, notification text, drill name/description, profile info values) upgraded from
    body2/caption (14px/12px) to body1/body2 (16px/14px) — secondary labels, timestamps, and captions
    (chip labels, field hints, "2h ago") intentionally stay smaller as true supporting metadata.
  - [state] "Back" (5 screens) and view-event's "Edit · Cancel" were static Typography masquerading as
    controls — not focusable, no accessible name/role. Converted to real text Buttons so they're
    reachable by keyboard and announced correctly by screen readers.
  - [state] AttendanceToggle's P/A/½ controls had role="button" + aria-label but no tabIndex, making
    them unreachable by keyboard despite looking interactive. Added tabIndex={0}.
-->

<script id="hifi-annotation-system">
/* ============================================================================
 * Hi-Fi Annotation System (category-aware, engine-agnostic)
 * ----------------------------------------------------------------------------
 * Drop-in vanilla-JS script that turns a hi-fi HTML file into a category-aware
 * click-to-comment review surface. Works for BOTH rendering engines:
 *   - shadcn engine: Tailwind Play CDN, static HTML body (no React).
 *   - mui engine:    React + MUI UMD + Babel rendering into #root asynchronously.
 *
 * Because the MUI engine mounts asynchronously, this script (a) initialises on
 * DOMContentLoaded, (b) re-scans `[data-cid]` elements whenever the active
 * screen changes, and (c) exposes `window.hifiAnnotations.rescan()` so the MUI
 * render code can call it after React commits. The shadcn engine needs neither —
 * its DOM is present at parse time — but calling rescan() is harmless.
 *
 * Categories: visual · copy · spacing · state · general.
 *
 * Colors come from the viewer-shell tokens (--shell-*) defined in the starter
 * template, NOT from the design system — so the overlay looks identical
 * regardless of whether the body is shadcn-themed or MUI-themed.
 * ============================================================================ */

(function() {
  'use strict';

  const CATEGORIES = ['general', 'visual', 'copy', 'spacing', 'state'];
  const CATEGORY_COLORS = {
    general: '#64748B',   // slate-500
    visual:  '#2563EB',   // blue-600
    copy:    '#0891B2',   // cyan-600
    spacing: '#CA8A04',   // yellow-600
    state:   '#16A34A'    // green-600
  };
  const STORAGE_PREFIX = 'hifi';

  // ============ STATE ============
  const state = {
    comments: JSON.parse(localStorage.getItem(STORAGE_PREFIX + '_comments') || '[]'),
    commentMode: false,
    activeScreen: null,
    activeCategory: 'all',
    nextId: 0,
    selectedElement: null,
    pinsHidden: localStorage.getItem(STORAGE_PREFIX + '_pins_hidden') === 'true'
  };
  state.nextId = state.comments.length > 0
    ? Math.max(...state.comments.map(c => c.id)) + 1 : 1;

  const screenNav = document.getElementById('screenNav');
  const flowText = document.getElementById('flowText');

  function allScreens() { return document.querySelectorAll('.hifi-screen'); }

  // ============ SCREEN NAVIGATION ============
  function buildTabs() {
    if (!screenNav) return;
    screenNav.innerHTML = '';
    allScreens().forEach((screen, i) => {
      const name = screen.dataset.screen;
      const label = name.charAt(0).toUpperCase() + name.slice(1).replace(/-/g, ' ');
      const tab = document.createElement('button');
      tab.className = 'hifi-tab' + (i === 0 ? ' active' : '');
      tab.textContent = label;
      tab.dataset.target = name;
      tab.addEventListener('click', () => switchScreen(name));
      screenNav.appendChild(tab);
    });
  }

  function switchScreen(name) {
    allScreens().forEach(s => s.classList.toggle('active', s.dataset.screen === name));
    if (screenNav) {
      screenNav.querySelectorAll('.hifi-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.target === name)
      );
    }
    state.activeScreen = name;
    updateFlowBar(name);
    if (state.commentMode) markCommentable();
    renderPins();
  }
  // expose for the MUI engine, which may switch screens via React state
  window.hifiSwitchScreen = switchScreen;

  function updateFlowBar(name) {
    if (!flowText) return;
    const screens = Array.from(allScreens());
    const idx = screens.findIndex(s => s.dataset.screen === name);
    const sect = screens[idx];
    const next = screens[idx + 1]?.dataset.screen;
    flowText.textContent = sect?.dataset.flow ||
      (next ? `User completes this screen → proceeds to "${next}"` : 'End of flow');
  }

  // ============ ANNOTATION PANEL ============
  const panel = document.createElement('div');
  panel.id = 'annotationPanel';
  panel.innerHTML = `
    <style>
      #annotationPanel {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
        background: var(--shell-surface, #fff);
        border-top: 2px solid var(--shell-accent, #2563EB);
        transform: translateY(calc(100% - 48px)); transition: transform 0.3s ease;
        max-height: 60vh; display: flex; flex-direction: column;
        font-family: var(--shell-font, system-ui, sans-serif);
        color: var(--shell-text, #0F172A);
      }
      #annotationPanel.open { transform: translateY(0); }
      .ann-toolbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 24px; min-height: 48px; cursor: pointer; user-select: none;
        flex-shrink: 0; gap: 12px; flex-wrap: wrap;
      }
      .ann-toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .ann-toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .ann-toggle-mode {
        padding: 6px 16px; font-size: 13px; font-weight: 600; border-radius: 6px;
        border: 1.5px solid; cursor: pointer; font-family: inherit; transition: all 150ms ease;
      }
      .ann-toggle-mode.off { background: var(--shell-surface,#fff); color: var(--shell-muted,#64748B); border-color: var(--shell-border,#E2E8F0); }
      .ann-toggle-mode.on  { background: var(--shell-accent,#2563EB); color: white; border-color: var(--shell-accent,#2563EB); }
      .ann-export-btn {
        padding: 6px 16px; font-size: 13px; font-weight: 500; border-radius: 6px;
        background: var(--shell-bg,#F8FAFC); color: var(--shell-text,#0F172A);
        border: 1.5px solid var(--shell-border,#E2E8F0); cursor: pointer; font-family: inherit;
      }
      .ann-export-btn:hover { background: var(--shell-accent-soft,#DBEAFE); }
      .ann-clear-btn {
        padding: 6px 12px; font-size: 13px; font-weight: 500; border-radius: 6px;
        background: transparent; color: #DC2626; border: 1.5px solid #DC2626; cursor: pointer; font-family: inherit;
      }
      .ann-count { font-size: 13px; font-weight: 600; color: var(--shell-muted,#64748B); }
      .ann-cat-filter { display: flex; gap: 4px; flex-wrap: wrap; }
      .ann-cat-filter button {
        padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 9999px;
        border: 1px solid var(--shell-border,#E2E8F0); background: var(--shell-surface,#fff);
        color: var(--shell-muted,#64748B); cursor: pointer; font-family: inherit;
      }
      .ann-cat-filter button.active { background: var(--shell-accent,#2563EB); color: white; border-color: var(--shell-accent,#2563EB); }
      .ann-body { flex: 1; overflow-y: auto; padding: 0 24px 16px; }
      .ann-comment-list { list-style: none; padding: 0; margin: 0; }
      .ann-comment-item {
        display: flex; gap: 12px; padding: 12px 0;
        border-bottom: 1px solid var(--shell-border,#E2E8F0);
        cursor: pointer; transition: background 150ms ease;
      }
      .ann-comment-item:hover { background: var(--shell-bg,#F8FAFC); margin: 0 -12px; padding: 12px; border-radius: 8px; }
      .ann-pin-badge {
        width: 28px; height: 28px; border-radius: 50%; background: var(--shell-accent,#2563EB); color: white;
        display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;
      }
      .ann-comment-content { flex: 1; min-width: 0; }
      .ann-comment-meta { font-size: 11px; color: var(--shell-muted,#64748B); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .ann-cat-pill { display: inline-block; padding: 1px 8px; border-radius: 9999px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: white; }
      .ann-comment-text { font-size: 14px; color: var(--shell-text,#0F172A); line-height: 1.4; }
      .ann-comment-resolved { opacity: 0.5; text-decoration: line-through; }
      .ann-resolve-btn, .ann-delete-btn { font-size: 11px; background: none; border: 1px solid; border-radius: 4px; padding: 2px 8px; cursor: pointer; margin-top: 4px; font-family: inherit; }
      .ann-resolve-btn { color: #16A34A; border-color: #16A34A; }
      .ann-delete-btn { color: #DC2626; border-color: #DC2626; margin-left: 4px; }
      .ann-empty { text-align: center; padding: 32px; color: var(--shell-muted,#64748B); font-size: 14px; }
      .hifi-comment-pin {
        position: absolute; width: 24px; height: 24px; border-radius: 50%; background: var(--shell-accent,#2563EB);
        color: white; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
        z-index: 50; pointer-events: none; box-shadow: 0 2px 6px rgba(37,99,235,0.4); transform: translate(-50%, -50%);
      }
      body.pins-hidden .hifi-comment-pin { display: none; }
      body.panel-open .hifi-main { padding-bottom: calc(60vh + 32px); }
      .hifi-commentable { position: relative; }
      body.comment-mode .hifi-screen.active .hifi-commentable:hover { outline: 2px solid var(--shell-accent,#2563EB) !important; outline-offset: 2px; cursor: crosshair; }
      .ann-popover {
        position: fixed; z-index: 2000; background: var(--shell-surface,#fff);
        border: 2px solid var(--shell-accent,#2563EB); border-radius: 12px; padding: 16px; width: 320px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.15); font-family: var(--shell-font,system-ui,sans-serif);
      }
      .ann-popover label.field { display: block; font-size: 11px; font-weight: 600; color: var(--shell-muted,#64748B); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
      .ann-popover textarea { width: 100%; min-height: 80px; padding: 8px 12px; font-family: inherit; font-size: 14px; border: 1.5px solid var(--shell-border,#E2E8F0); border-radius: 8px; resize: vertical; margin-bottom: 8px; box-sizing: border-box; color: var(--shell-text,#0F172A); background: var(--shell-surface,#fff); }
      .ann-popover textarea:focus { outline: none; border-color: var(--shell-accent,#2563EB); }
      .ann-popover select { width: 100%; padding: 6px 10px; font-family: inherit; font-size: 13px; border: 1.5px solid var(--shell-border,#E2E8F0); border-radius: 6px; margin-bottom: 8px; box-sizing: border-box; background: var(--shell-surface,#fff); color: var(--shell-text,#0F172A); }
      .ann-popover-actions { display: flex; gap: 8px; justify-content: flex-end; }
      .ann-popover-label { font-size: 12px; color: var(--shell-muted,#64748B); margin-bottom: 8px; }
      .ann-popover-actions button { padding: 6px 12px; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; font-family: inherit; border: 1.5px solid; }
      .ann-popover-actions .cancel { background: transparent; color: var(--shell-muted,#64748B); border-color: var(--shell-border,#E2E8F0); }
      .ann-popover-actions .save { background: var(--shell-accent,#2563EB); color: white; border-color: var(--shell-accent,#2563EB); }
    </style>
    <div class="ann-toolbar" id="annToolbar">
      <div class="ann-toolbar-left">
        <button class="ann-toggle-mode off" id="annToggle">Comment Mode: Off</button>
        <span class="ann-count" id="annCount">0 comments</span>
        <button class="ann-export-btn" id="annPinsToggle">Hide Pins</button>
      </div>
      <div class="ann-toolbar-right">
        <button class="ann-export-btn" id="annExport">Export JSON</button>
        <button class="ann-export-btn" id="annCopy">Copy for Claude</button>
        <button class="ann-clear-btn" id="annClear">Clear All</button>
      </div>
    </div>
    <div style="padding: 0 24px 8px;">
      <div class="ann-cat-filter" id="annCatFilter">
        <button data-cat="all" class="active">All</button>
        ${CATEGORIES.map(c => `<button data-cat="${c}">${c}</button>`).join('')}
      </div>
    </div>
    <div class="ann-body" id="annBody">
      <div class="ann-empty" id="annEmpty">Enable Comment Mode, then click any element to leave categorized feedback.</div>
      <ul class="ann-comment-list" id="annList" style="display:none;"></ul>
    </div>
  `;
  document.body.appendChild(panel);

  // ============ MAKE ELEMENTS COMMENTABLE ============
  // Engine-agnostic: any element carrying a data-cid is commentable, plus the
  // semantic headings inside a screen. This works for shadcn (data-cid on the
  // class-string markup) and MUI (data-cid passed via the component's data prop).
  function markCommentable() {
    document.querySelectorAll(
      '.hifi-screen [data-cid], ' +
      '.hifi-screen h1, .hifi-screen h2, .hifi-screen h3, .hifi-screen h4'
    ).forEach(el => {
      el.classList.add('hifi-commentable');
      if (!el.dataset.cid) {
        el.dataset.cid = el.tagName.toLowerCase() + '-' +
          (el.textContent || '').trim().slice(0, 20).replace(/\s+/g, '-').toLowerCase() +
          '-' + Math.random().toString(36).slice(2, 6);
      }
    });
  }

  // Public rescan hook for the MUI engine to call after React commits / route change.
  window.hifiAnnotations = {
    rescan() { if (state.commentMode) markCommentable(); renderPins(); }
  };

  // ============ TOGGLE COMMENT MODE ============
  const toggleBtn = document.getElementById('annToggle');
  toggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    state.commentMode = !state.commentMode;
    toggleBtn.textContent = `Comment Mode: ${state.commentMode ? 'On' : 'Off'}`;
    toggleBtn.className = `ann-toggle-mode ${state.commentMode ? 'on' : 'off'}`;
    document.body.classList.toggle('comment-mode', state.commentMode);
    markCommentable();
  });

  // ============ PIN VISIBILITY ============
  const pinsToggleBtn = document.getElementById('annPinsToggle');
  function applyPinsHidden() {
    document.body.classList.toggle('pins-hidden', state.pinsHidden);
    pinsToggleBtn.textContent = state.pinsHidden ? 'Show Pins' : 'Hide Pins';
  }
  pinsToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    state.pinsHidden = !state.pinsHidden;
    applyPinsHidden();
    try { localStorage.setItem(STORAGE_PREFIX + '_pins_hidden', String(state.pinsHidden)); } catch(_) {}
  });
  applyPinsHidden();

  // ============ CATEGORY FILTER ============
  document.getElementById('annCatFilter').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    e.stopPropagation();
    state.activeCategory = btn.dataset.cat;
    document.getElementById('annCatFilter').querySelectorAll('button')
      .forEach(b => b.classList.toggle('active', b === btn));
    renderComments();
    renderPins();
  });

  // ============ PANEL EXPAND/COLLAPSE ============
  function setPanelOpen(open) {
    panel.classList.toggle('open', open);
    document.body.classList.toggle('panel-open', open);
  }
  document.getElementById('annToolbar').addEventListener('click', (e) => {
    if (e.target === toggleBtn || e.target === pinsToggleBtn || e.target.closest('.ann-toolbar-right')) return;
    setPanelOpen(!panel.classList.contains('open'));
  });

  // ============ CLICK TO COMMENT ============
  document.addEventListener('click', (e) => {
    if (!state.commentMode) return;
    const target = e.target.closest('.hifi-commentable');
    if (!target || e.target.closest('#annotationPanel') || e.target.closest('.ann-popover')) return;
    e.preventDefault();
    e.stopPropagation();
    openPopover(target, e.clientX, e.clientY);
  });

  function openPopover(element, x, y) {
    closePopover();
    state.selectedElement = element;
    const pop = document.createElement('div');
    pop.className = 'ann-popover';
    pop.id = 'annPopover';

    const elementName = element.dataset.cid || element.tagName.toLowerCase();
    const screenName = element.closest('.hifi-screen')?.dataset.screen || state.activeScreen;

    pop.innerHTML = `
      <div class="ann-popover-label">Comment on: <strong>${elementName}</strong><br/>Screen: ${screenName}</div>
      <label class="field" for="annCat">Category</label>
      <select id="annCat">
        ${CATEGORIES.map(c => `<option value="${c}" ${c==='general'?'selected':''}>${c}</option>`).join('')}
      </select>
      <label class="field" for="annInput">Comment</label>
      <textarea id="annInput" placeholder="Describe the change you'd like..." autofocus></textarea>
      <div class="ann-popover-actions">
        <button class="cancel" id="annCancel">Cancel</button>
        <button class="save" id="annSave">Save Comment</button>
      </div>
    `;

    const popW = 320, popH = 300;
    let left = Math.min(x + 12, window.innerWidth - popW - 16);
    let top = Math.min(y + 12, window.innerHeight - popH - 16);
    left = Math.max(16, left); top = Math.max(16, top);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';

    document.body.appendChild(pop);
    pop.querySelector('#annInput').focus();

    pop.querySelector('#annCancel').addEventListener('click', closePopover);
    pop.querySelector('#annSave').addEventListener('click', () => {
      const text = pop.querySelector('#annInput').value.trim();
      const category = pop.querySelector('#annCat').value;
      if (!text) return;

      const rect = element.getBoundingClientRect();
      const screenRect = element.closest('.hifi-screen-frame')?.getBoundingClientRect() || rect;

      state.comments.push({
        id: state.nextId++,
        screen: screenName,
        element: elementName,
        category,
        text,
        position: {
          x: Math.round(rect.left - screenRect.left + rect.width / 2),
          y: Math.round(rect.top - screenRect.top + rect.height / 2)
        },
        timestamp: new Date().toISOString(),
        resolved: false
      });
      saveComments();
      renderComments();
      renderPins();
      closePopover();
      setPanelOpen(true);
    });
  }

  function closePopover() {
    const pop = document.getElementById('annPopover');
    if (pop) pop.remove();
    state.selectedElement = null;
  }

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopover(); });

  // ============ RENDER ============
  function visibleComments() {
    if (state.activeCategory === 'all') return state.comments;
    return state.comments.filter(c => c.category === state.activeCategory);
  }

  function renderComments() {
    const list = document.getElementById('annList');
    const empty = document.getElementById('annEmpty');
    const count = document.getElementById('annCount');
    const visible = visibleComments();
    count.textContent = `${visible.length} comment${visible.length !== 1 ? 's' : ''}` +
      (state.activeCategory !== 'all' ? ` · ${state.activeCategory}` : '');

    if (visible.length === 0) { empty.style.display = 'block'; list.style.display = 'none'; return; }
    empty.style.display = 'none';
    list.style.display = 'block';

    const grouped = {};
    visible.forEach(c => { (grouped[c.screen] = grouped[c.screen] || []).push(c); });

    list.innerHTML = Object.entries(grouped).map(([screen, comments]) => `
      <li style="padding:8px 0;font-weight:600;font-size:12px;color:var(--shell-muted,#64748B);text-transform:uppercase;letter-spacing:0.05em;border:none;list-style:none;">${screen}</li>
      ${comments.map(c => `
        <li class="ann-comment-item ${c.resolved ? 'ann-comment-resolved' : ''}" data-comment-id="${c.id}" data-screen="${c.screen}">
          <div class="ann-pin-badge" style="background: ${CATEGORY_COLORS[c.category]||CATEGORY_COLORS.general};">${c.id}</div>
          <div class="ann-comment-content">
            <div class="ann-comment-meta">
              <span class="ann-cat-pill" style="background:${CATEGORY_COLORS[c.category]||CATEGORY_COLORS.general};">${c.category}</span>
              <span>${c.element}</span><span>·</span><span>${new Date(c.timestamp).toLocaleTimeString()}</span>
            </div>
            <div class="ann-comment-text">${escapeHtml(c.text)}</div>
            <div style="display:flex;gap:4px;margin-top:4px;">
              ${!c.resolved ? `<button class="ann-resolve-btn" data-id="${c.id}">✓ Resolve</button>` : ''}
              <button class="ann-delete-btn" data-id="${c.id}">✕ Delete</button>
            </div>
          </div>
        </li>
      `).join('')}
    `).join('');

    list.querySelectorAll('.ann-resolve-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(btn.dataset.id);
        const c = state.comments.find(c => c.id === id);
        if (c) { c.resolved = true; saveComments(); renderComments(); renderPins(); }
      });
    });
    list.querySelectorAll('.ann-delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(btn.dataset.id);
        state.comments = state.comments.filter(c => c.id !== id);
        saveComments(); renderComments(); renderPins();
      });
    });
    list.querySelectorAll('.ann-comment-item[data-screen]').forEach(item => {
      item.addEventListener('click', () => {
        const screen = item.dataset.screen;
        if (screen && screen !== state.activeScreen) switchScreen(screen);
      });
    });
  }

  function renderPins() {
    document.querySelectorAll('.hifi-comment-pin').forEach(p => p.remove());
    const visible = state.comments.filter(c =>
      c.screen === state.activeScreen && !c.resolved &&
      (state.activeCategory === 'all' || c.category === state.activeCategory)
    );
    visible.forEach(c => {
      const screenEl = document.querySelector(`.hifi-screen[data-screen="${c.screen}"] .hifi-screen-frame`);
      if (!screenEl) return;
      const pin = document.createElement('div');
      pin.className = 'hifi-comment-pin';
      pin.textContent = c.id;
      pin.style.left = c.position.x + 'px';
      pin.style.top = c.position.y + 'px';
      pin.style.background = CATEGORY_COLORS[c.category] || CATEGORY_COLORS.general;
      screenEl.style.position = 'relative';
      screenEl.appendChild(pin);
    });
  }

  // ============ EXPORT ============
  document.getElementById('annExport').addEventListener('click', (e) => {
    e.stopPropagation();
    const projectName = document.querySelector('.hifi-header-title')?.textContent?.trim() || 'Hi-Fi';
    const exportData = {
      project: projectName,
      stage: 'hifi',
      exported_at: new Date().toISOString(),
      total_comments: state.comments.length,
      pending: state.comments.filter(c => !c.resolved).length,
      resolved: state.comments.filter(c => c.resolved).length,
      by_category: CATEGORIES.reduce((acc, cat) => { acc[cat] = state.comments.filter(c => c.category === cat).length; return acc; }, {}),
      screens: {}
    };
    state.comments.forEach(c => {
      (exportData.screens[c.screen] = exportData.screens[c.screen] || []).push({
        id: c.id, element: c.element, category: c.category, text: c.text,
        position: c.position, timestamp: c.timestamp, resolved: c.resolved
      });
    });
    exportData.screens = Object.entries(exportData.screens).map(([name, comments]) => ({ name, comments }));

    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'hifi-comments.json';
    a.click();
  });

  document.getElementById('annCopy').addEventListener('click', (e) => {
    e.stopPropagation();
    const pending = state.comments.filter(c => !c.resolved);
    if (pending.length === 0) { alert('No pending comments to copy.'); return; }
    let text = 'Here are the hi-fi review comments. Use the wireframe-to-hifi skill to apply them — create a NEW version file (`<slug>-hifi-v<N+1>.html` in `projects/<slug>/hifi/`). Do not edit the current file in place.\n\n';
    const byCat = {};
    pending.forEach(c => {
      byCat[c.category] = byCat[c.category] || {};
      (byCat[c.category][c.screen] = byCat[c.category][c.screen] || []).push(c);
    });
    Object.entries(byCat).forEach(([cat, screens]) => {
      text += `## Category: ${cat}\n\n`;
      Object.entries(screens).forEach(([screen, comments]) => {
        text += `**Screen: ${screen}**\n`;
        comments.forEach(c => { text += `- [${c.element}]: ${c.text}\n`; });
        text += '\n';
      });
    });
    copyToClipboard(text).then(() => {
      const btn = document.getElementById('annCopy');
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = orig, 2000);
    }).catch(err => { console.warn('[ann] Copy failed:', err); showCopyFallback(text); });
  });

  // Clipboard helper: navigator.clipboard on https/localhost; textarea fallback for file://.
  function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? resolve() : reject(new Error('execCommand returned false')); }
      catch (e) { reject(e); } finally { document.body.removeChild(ta); }
    });
  }

  function showCopyFallback(text) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:24px;';
    overlay.innerHTML = `
      <div style="background:#fff;border-radius:8px;padding:16px;max-width:720px;width:100%;display:flex;flex-direction:column;gap:8px;box-shadow:0 24px 48px rgba(0,0,0,0.3);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong style="font:600 14px system-ui;">Copy these comments manually</strong>
          <button id="annFallbackClose" style="border:0;background:#eee;border-radius:4px;padding:4px 8px;cursor:pointer;">Close</button>
        </div>
        <p style="margin:0;font:13px system-ui;color:#555;">Automatic copy isn't available on file:// pages. Select all the text below and copy it.</p>
        <textarea id="annFallbackText" readonly style="width:100%;height:320px;font:12px/1.4 ui-monospace,Menlo,monospace;padding:12px;border:1px solid #ccc;border-radius:4px;"></textarea>
      </div>`;
    document.body.appendChild(overlay);
    const ta = overlay.querySelector('#annFallbackText');
    ta.value = text; ta.focus(); ta.select();
    overlay.querySelector('#annFallbackClose').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  }

  document.getElementById('annClear').addEventListener('click', (e) => {
    e.stopPropagation();
    if (state.comments.length === 0) return;
    if (!confirm('Delete all comments? This cannot be undone.')) return;
    state.comments = [];
    state.nextId = 1;
    saveComments(); renderComments(); renderPins();
  });

  // ============ UTILITIES ============
  function saveComments() { try { localStorage.setItem(STORAGE_PREFIX + '_comments', JSON.stringify(state.comments)); } catch(e) {} }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

  // ============ INIT ============
  function init() {
    buildTabs();
    state.activeScreen = allScreens()[0]?.dataset.screen;
    renderComments();
    renderPins();
    updateFlowBar(state.activeScreen);
    markCommentable();
  }

  // The shadcn engine has its DOM ready immediately. The MUI engine renders into
  // #root asynchronously, so screen tabs may not exist yet at parse time — retry
  // until at least one .hifi-screen appears (then the MUI code can also call
  // window.hifiAnnotations.rescan() after route changes).
  if (allScreens().length > 0) {
    init();
  } else {
    let tries = 0;
    const poll = setInterval(() => {
      if (allScreens().length > 0 || ++tries > 40) { clearInterval(poll); init(); }
    }, 50);
  }
})();
</script>

</body>
</html>
